name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check siprtc_mcp tests
      - run: ruff format --check siprtc_mcp tests
      - run: python scripts/tool_reference.py --check
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t siprtc-mcp:ci .
      - name: health check answers
        run: |
          docker run -d --name mcp -p 8000:8000 siprtc-mcp:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && exit 0; sleep 1; done
          docker logs mcp; exit 1
