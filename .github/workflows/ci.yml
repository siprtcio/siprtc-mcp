name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check siprtc_mcp tests
      - run: ruff format --check siprtc_mcp tests
      - run: python scripts/tool_reference.py --check
      - run: pytest -q

  locked:
    # The versions the Docker image ships (requirements.txt), not whatever pip resolves today.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes --no-deps -r requirements.txt
      - run: python -m pip install --no-deps -e . && python -m pip install pytest pytest-asyncio respx
      - run: python -m pip check
      - run: pytest -q

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: known vulnerabilities in the locked dependencies
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit --strict --require-hashes --disable-pip -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t siprtc-mcp:ci .
      - name: health check answers, and the MCP route wants a token
        run: |
          docker run -d --name mcp --read-only --cap-drop ALL -p 127.0.0.1:8000:8000 siprtc-mcp:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && break; sleep 1; done
          test "$(docker exec mcp id -u)" = 10001
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' -d '{}' localhost:8000/mcp)
          test "$code" = 401 || { echo "unauthenticated /mcp answered $code"; docker logs mcp; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'host: evil.example' localhost:8000/healthz)
          test "$code" = 421 || { echo "foreign Host answered $code"; docker logs mcp; exit 1; }
