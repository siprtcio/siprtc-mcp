[project]
name = "siprtc-mcp"
version = "0.1.0"
description = "MCP server for Siprtc CPaaS APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.2.3",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
]

[project.scripts]
siprtc-mcp = "siprtc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
