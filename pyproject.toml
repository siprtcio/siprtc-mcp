[project]
name = "siprtc-mcp"
version = "0.1.0"
description = "MCP server for Siprtc CPaaS APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
]

[project.scripts]
siprtc-mcp = "siprtc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
